<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background / Shield Gradients -->
    <linearGradient id="vgShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Chevron V Primary Gradient -->
    <linearGradient id="vgChevron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Inner Core Cyan Glow Gradient -->
    <linearGradient id="vgCoreGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="vgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glowing Aura -->
  <path d="M 50 6 C 75 6 90 20 90 48 C 90 76 68 92 50 97 C 32 92 10 76 10 48 C 10 20 25 6 50 6 Z" 
        fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.4" filter="url(#vgGlow)" />

  <!-- Main Shield Body -->
  <path d="M 50 8 C 72 8 86 21 86 46 C 86 73 66 88 50 93 C 34 88 14 73 14 46 C 14 21 28 8 50 8 Z" 
        fill="url(#vgShieldBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Shield Inner Border Accent -->
  <path d="M 50 14 C 67 14 79 25 79 45 C 79 67 62 80 50 84 C 38 80 21 67 21 45 C 21 25 33 14 50 14 Z" 
        fill="none" stroke="url(#vgCoreGlow)" stroke-width="1.5" opacity="0.6" />

  <!-- Dynamic Faceted "V" Chevron -->
  <!-- Left Wing -->
  <path d="M 26 26 L 50 78 L 42 78 L 20 30 Z" fill="#0284C7" />
  <!-- Right Wing -->
  <path d="M 74 26 L 50 78 L 58 78 L 80 30 Z" fill="#38BDF8" />
  <!-- Main Foreground V -->
  <path d="M 24 24 L 50 74 L 76 24 L 62 24 L 50 56 L 38 24 Z" fill="url(#vgChevron)" filter="url(#vgGlow)" />

  <!-- Central Pulse Energy Sparkle -->
  <polygon points="50,32 53,42 63,45 53,48 50,58 47,48 37,45 47,42" fill="#FFFFFF" opacity="0.95" />
  <circle cx="50" cy="45" r="3" fill="#22D3EE" filter="url(#vgGlow)" />
</svg>